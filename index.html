<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('https://files.catbox.moe/3xmeht.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .page {
            display: none;
            width: 100%;
            animation: fadeIn 1s ease-in-out;
        }

        .active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Halaman 1 - Welcome */
        .welcome-text {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
            animation: colorChange 15s infinite;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes colorChange {
            0% { color: #ff6b6b; }
            33% { color: #48dbfb; }
            66% { color: #1dd1a1; }
            100% { color: #ff6b6b; }
        }

        /* Halaman 2 - Profile */
        .profile-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff6b6b;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .profile-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-feedback {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn-shop {
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            color: white;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Halaman 3 - Shop */
        .shop-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: #ff6b6b;
        }

        .product-card.selected {
            border-color: #48dbfb;
            background: rgba(72, 219, 251, 0.2);
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-price {
            color: #ff6b6b;
            font-weight: bold;
        }

        .total-section {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .total-price {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn-pay {
            background: linear-gradient(45deg, #1dd1a1, #10ac84);
            color: white;
            font-size: 1.2rem;
            padding: 15px 40px;
        }

        /* Halaman 4 - Payment */
        .payment-methods {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .payment-method {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            backdrop-filter: blur(10px);
        }

        .payment-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: block;
        }

        .payment-details {
            margin-top: 15px;
        }

        .copyable {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copyable:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .reminder {
            margin: 20px 0;
            font-size: 1.2rem;
            color: #ff6b6b;
            font-weight: bold;
        }

        /* Halaman 5 - Contact */
        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .contact-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            width: 180px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .contact-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .contact-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        .btn-whatsapp {
            background: linear-gradient(45deg, #25D366, #128C7E);
        }

        .btn-telegram {
            background: linear-gradient(45deg, #0088cc, #006699);
        }

        /* Responsif */
        @media (max-width: 768px) {
            .welcome-text {
                font-size: 2rem;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .payment-methods {
                flex-direction: column;
                align-items: center;
            }
            
            .contact-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <!-- Halaman 1 - Welcome -->
    <div id="page1" class="page active">
        <div class="container">
            <div class="welcome-text" id="welcomeText">WELCOME MY BUYER</div>
        </div>
    </div>

    <!-- Halaman 2 - Profile -->
    <div id="page2" class="page">
        <div class="container">
            <div class="profile-card">
                <img src="https://files.catbox.moe/a78nhx.jpg" alt="Profile" class="profile-img">
                <div class="profile-buttons">
                    <a href="mailto:vallcxc01@gmail.com" class="btn btn-feedback">FEEDBACK</a>
                    <a href="#" class="btn btn-shop" id="shopBtn">SHOP</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Halaman 3 - Shop -->
    <div id="page3" class="page">
        <div class="container">
            <h1 class="shop-title">PRODUCTS</h1>
            <div class="products-grid" id="productsGrid">
                <!-- Produk akan diisi dengan JavaScript -->
            </div>
            <div class="total-section">
                <div class="total-price">Total: Rp <span id="totalPrice">0</span></div>
                <button class="btn btn-pay" id="payBtn">BAYAR</button>
            </div>
        </div>
    </div>

    <!-- Halaman 4 - Payment -->
    <div id="page4" class="page">
        <div class="container">
            <h1 class="shop-title">PAYMENT</h1>
            <div class="payment-methods">
                <div class="payment-method">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA" class="payment-logo">
                    <div class="payment-details">
                        <div class="copyable" onclick="copyToClipboard('085194732962')">
                            <strong>085194732962</strong>
                        </div>
                        <p>ATAS NAMA: VALL</p>
                    </div>
                </div>
                <div class="payment-method">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Gopay_logo.svg/1200px-Gopay_logo.svg.png" alt="GOPAY" class="payment-logo">
                    <div class="payment-details">
                        <div class="copyable" onclick="copyToClipboard('085194732962')">
                            <strong>085194732962</strong>
                        </div>
                        <p>ATAS NAMA: VALL</p>
                    </div>
                </div>
            </div>
            <div class="reminder">JANGAN LUPA KIRIM BUKTI PEMBAYARAN</div>
            <button class="btn btn-pay" id="paidBtn">SUDAH MEMBAYAR</button>
        </div>
    </div>

    <!-- Halaman 5 - Contact -->
    <div id="page5" class="page">
        <div class="container">
            <h1 class="shop-title">CONTACT US</h1>
            <div class="contact-buttons">
                <a href="https://wa.me/6285194732962" target="_blank" class="contact-btn btn-whatsapp">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="contact-logo">
                    <span>WHATSAPP</span>
                </a>
                <a href="https://t.me/mivaldsaturn" target="_blank" class="contact-btn btn-telegram">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="contact-logo">
                    <span>TELEGRAM</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Audio Player -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/vd6ahj.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Data produk
        const products = [
            { id: 1, name: "STUDENT BANN", price: 10000 },
            { id: 2, name: "STUDENT UNBANN", price: 10000 },
            { id: 3, name: "STUDENT BUG", price: 15000 },
            { id: 4, name: "SCRIPT MD", price: 10000 },
            { id: 5, name: "SCRIPT PUSH", price: 5000 },
            { id: 6, name: "SCRIPT CPANEL", price: 5000 },
            { id: 7, name: "SCRIPT BUG", price: 20000 },
            { id: 8, name: "JOIN PARTNER", price: 10000 },
            { id: 9, name: "JASA RENAME", price: 10000 },
            { id: 10, name: "NOKOS INDONESIA", price: 5000 },
            { id: 11, name: "RESELLER PANEL", price: 5000 },
            { id: 12, name: "BOT JAGA GRUP", price: 10000 },
            { id: 13, name: "ADMIN PANEL", price: 8000 },
            { id: 14, name: "CREATE WEB", price: 5000 },
            { id: 15, name: "SCRIPT JASHER", price: 5000 },
            { id: 16, name: "UBOT", price: 5000 },
            { id: 17, name: "FILE BADAK", price: 20000 }
        ];

        // Variabel global
        let selectedProducts = [];
        let currentPage = 1;
        const totalPages = 5;

        // Fungsi untuk mengubah halaman
        function changePage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(`page${pageNumber}`).classList.add('active');
            currentPage = pageNumber;
        }

        // Fungsi untuk menyalin teks ke clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Nomor berhasil disalin: ' + text);
            });
        }

        // Fungsi untuk menghitung total harga
        function calculateTotal() {
            let total = 0;
            selectedProducts.forEach(productId => {
                const product = products.find(p => p.id === productId);
                if (product) total += product.price;
            });
            document.getElementById('totalPrice').textContent = total.toLocaleString('id-ID');
        }

        // Fungsi untuk membuat produk
        function createProducts() {
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">Rp ${product.price.toLocaleString('id-ID')}</div>
                `;
                
                productCard.addEventListener('click', () => {
                    productCard.classList.toggle('selected');
                    
                    if (productCard.classList.contains('selected')) {
                        selectedProducts.push(product.id);
                    } else {
                        selectedProducts = selectedProducts.filter(id => id !== product.id);
                    }
                    
                    calculateTotal();
                });
                
                productsGrid.appendChild(productCard);
            });
        }

        // Animasi teks welcome
        const welcomeTexts = ["WELCOME MY BUYER", "SELAMAT BERBELANJA", "WEBSITE INI DIBUAT OLEH MIVALDSATURN"];
        let currentTextIndex = 0;
        const welcomeTextElement = document.getElementById('welcomeText');

        function changeWelcomeText() {
            currentTextIndex = (currentTextIndex + 1) % welcomeTexts.length;
            welcomeTextElement.textContent = welcomeTexts[currentTextIndex];
            
            if (currentTextIndex === welcomeTexts.length - 1) {
                setTimeout(() => {
                    changePage(2);
                    document.getElementById('bgMusic').play();
                }, 2000);
            }
        }

        // Event Listeners
        document.getElementById('shopBtn').addEventListener('click', (e) => {
            e.preventDefault();
            changePage(3);
        });

        document.getElementById('payBtn').addEventListener('click', () => {
            if (selectedProducts.length === 0) {
                alert('Pilih setidaknya satu produk!');
                return;
            }
            changePage(4);
        });

        document.getElementById('paidBtn').addEventListener('click', () => {
            changePage(5);
        });

        // Inisialisasi
        document.addEventListener('DOMContentLoaded', () => {
            createProducts();
            
            // Mulai animasi teks welcome
            setInterval(changeWelcomeText, 3000);
            
            // Coba putar musik (browser mungkin memblokir autoplay)
            setTimeout(() => {
                document.getElementById('bgMusic').play().catch(e => {
                    console.log("Autoplay diblokir, pengguna harus berinteraksi terlebih dahulu");
                });
            }, 1000);
        });

        // Izinkan musik diputar setelah interaksi pengguna
        document.addEventListener('click', () => {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic.paused) {
                bgMusic.play();
            }
        });
    </script>
</body>
</html>
